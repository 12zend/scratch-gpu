<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<title>scratch-gpu</title>
<link rel="icon" href="data:,">
<script src="https://unpkg.com/lucide@latest/dist/umd/lucide.min.js"></script>
<style>
  :root {
    --background: #09090b;
    --foreground: #fafafa;
    --card: #18181b;
    --card-foreground: #fafafa;
    --primary: #fafafa;
    --primary-foreground: #18181b;
    --secondary: #27272a;
    --secondary-foreground: #fafafa;
    --muted: #27272a;
    --muted-foreground: #a1a1aa;
    --border: #27272a;
    --radius: 0.75rem;
    --ring: #d4d4d8;
  }

  * { box-sizing: border-box; }

  html, body {
    margin: 0;
    padding: 0;
    width: 100%;
    height: 100%;
    overflow: hidden;
    background: var(--background);
    color: var(--foreground);
    font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
  }

  #app {
    width: 100%;
    height: 100%;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: 1rem;
    padding: 1rem;
  }

  #player-frame {
    position: relative;
    width: min(720px, 85vw);
    aspect-ratio: 4 / 3;
    background: var(--card);
    border: 1px solid var(--border);
    border-radius: var(--radius);
    box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.5);
    overflow: hidden;
  }

  #player-frame > #container {
    position: absolute;
    inset: 0;
  }

  #drop {
    position: absolute;
    inset: 0;
    display: flex;
    align-items: center;
    justify-content: center;
    flex-direction: column;
    gap: 12px;
    color: var(--muted-foreground);
    font-size: 11px;
    letter-spacing: 0.18em;
    text-transform: uppercase;
    transition: color 0.2s, background 0.2s;
    z-index: 10;
    pointer-events: none;
  }
  #drop.over {
    color: var(--foreground);
    background: rgba(255, 255, 255, 0.05);
  }
  #drop.hidden { display: none; }
  #drop .picker {
    pointer-events: auto;
    text-decoration: underline;
    cursor: pointer;
    color: var(--muted-foreground);
  }
  #drop .picker:hover { color: var(--foreground); }

  #file-input {
    position: absolute;
    left: -9999px;
    width: 1px;
    height: 1px;
    opacity: 0;
    pointer-events: none;
  }

  #status {
    position: absolute;
    top: 10px;
    left: 12px;
    z-index: 20;
    color: var(--muted-foreground);
    font-size: 10px;
    letter-spacing: 0.1em;
    text-transform: uppercase;
    pointer-events: none;
    white-space: pre;
  }

  #controls {
    display: flex;
    align-items: center;
    gap: 0.5rem;
    padding: 0.5rem 1rem;
    background: var(--card);
    border: 1px solid var(--border);
    border-radius: var(--radius);
  }

  #controls button {
    display: inline-flex;
    align-items: center;
    justify-content: center;
    width: 2.25rem;
    height: 2.25rem;
    border: 1px solid var(--border);
    border-radius: calc(var(--radius) - 0.25rem);
    background: var(--secondary);
    color: var(--secondary-foreground);
    cursor: pointer;
    transition: background 0.15s, border-color 0.15s, color 0.15s;
  }
  #controls button:hover {
    background: var(--muted);
    border-color: var(--ring);
  }
  #controls button:active {
    transform: translateY(1px);
  }
  #controls button svg {
    width: 1rem;
    height: 1rem;
  }

  #volume-group {
    display: inline-flex;
    align-items: center;
    gap: 0.5rem;
    margin-left: 0.5rem;
    padding-left: 0.75rem;
    border-left: 1px solid var(--border);
  }
  #volume-group svg {
    width: 1rem;
    height: 1rem;
    color: var(--muted-foreground);
  }

  #url-bar {
    display: flex;
    align-items: center;
    gap: 0.5rem;
    width: min(720px, 85vw);
    padding: 0.5rem 0.75rem;
    background: var(--card);
    border: 1px solid var(--border);
    border-radius: var(--radius);
  }
  #url-bar input {
    flex: 1;
    min-width: 0;
    padding: 0.4rem 0.6rem;
    border: 1px solid var(--border);
    border-radius: calc(var(--radius) - 0.25rem);
    background: var(--background);
    color: var(--foreground);
    font-size: 13px;
  }
  #url-bar input::placeholder {
    color: var(--muted-foreground);
  }
  #url-bar button {
    display: inline-flex;
    align-items: center;
    gap: 0.4rem;
    padding: 0.45rem 0.9rem;
    border: 1px solid var(--border);
    border-radius: calc(var(--radius) - 0.25rem);
    background: var(--primary);
    color: var(--primary-foreground);
    font-size: 13px;
    font-weight: 600;
    cursor: pointer;
    transition: opacity 0.15s;
    white-space: nowrap;
  }
  #url-bar button:hover {
    opacity: 0.9;
  }
  #url-bar button:disabled {
    opacity: 0.5;
    cursor: not-allowed;
  }
  #url-bar button svg {
    width: 0.875rem;
    height: 0.875rem;
  }

  input[type="range"]#volume {
    -webkit-appearance: none;
    appearance: none;
    width: 120px;
    height: 4px;
    background: var(--muted);
    border-radius: 999px;
    cursor: pointer;
  }
  input[type="range"]#volume::-webkit-slider-thumb {
    -webkit-appearance: none;
    appearance: none;
    width: 16px;
    height: 16px;
    background: var(--primary);
    border-radius: 50%;
    border: 2px solid var(--card);
    box-shadow: 0 0 0 1px var(--border);
    transition: transform 0.15s;
  }
  input[type="range"]#volume::-webkit-slider-thumb:hover {
    transform: scale(1.1);
  }
  input[type="range"]#volume::-moz-range-thumb {
    width: 16px;
    height: 16px;
    background: var(--primary);
    border-radius: 50%;
    border: 2px solid var(--card);
    box-shadow: 0 0 0 1px var(--border);
  }

  /* Keep the web app's own controls; scaffolding's built-in bar is not needed. */
  .sc-root .sc-controls-bar { display: none !important; }
  /* Hide the shader diagnostics overlay. */
  .sc-shader-status { display: none !important; }
  /* The shader canvas is composited over the normal Scratch renderer.
     Pointer events pass through so sprites and the stage remain clickable. */
  .sc-shader-canvas { pointer-events: none !important; }
  .sc-root {
    background: #000;
  }
  /* Hide the Scratch stage until a project is loaded so the pre-load screen stays black. */
  #container:not(.loaded) .sc-canvas { display: none !important; }
</style>
</head>
<body>
<div id="app">
  <div id="player-frame">
    <div id="drop">
      <div>drop .sb3 &nbsp;·&nbsp; esc to reset</div>
      <label class="picker" id="picker" for="file-input">or click to choose file</label>
    </div>
    <input type="file" id="file-input" accept=".sb3">
    <div id="status">ready</div>
    <div id="container"></div>
  </div>

  <div id="url-bar">
    <input type="text" id="scratch-url" placeholder="https://scratch.mit.edu/projects/">
    <button id="load-url" type="button">Load</button>
  </div>

  <div id="controls">
    <button id="play-pause" type="button" aria-label="Play">
      <i data-lucide="play"></i>
    </button>
    <button id="reload" type="button" aria-label="Reload">
      <i data-lucide="rotate-ccw"></i>
    </button>
    <div id="volume-group">
      <i data-lucide="volume-2"></i>
      <input type="range" id="volume" min="0" max="100" value="100">
    </div>
  </div>
</div>

<script src="./scaffolding-min.js"></script>
<script>
  lucide.createIcons();

  const status = document.getElementById('status');
  const log = (msg) => { status.textContent = msg; console.log('[scratch-gpu]', msg); };

  const s = new Scaffolding.Scaffolding();
  s.width = 480;
  s.height = 360;
  s.shaderScale = 1;
  s.editableLists = true;
  s.shouldConnectPeripherals = false;
  s.setup();
  s.appendTo(document.getElementById('container'));

  const storage = s.storage;
  storage.addWebStore(
    [storage.AssetType.ImageVector, storage.AssetType.ImageBitmap, storage.AssetType.Sound],
    (asset) => `https://assets.scratch.mit.edu/internalapi/asset/${asset.assetId}.${asset.dataFormat}/get/`
  );

  s.vm.on('ASSET_PROGRESS', (finished, total) => {
    log(`loading assets: ${finished} / ${total}`);
  });

  // Controls
  const playPauseBtn = document.getElementById('play-pause');
  const reloadBtn = document.getElementById('reload');
  const volumeSlider = document.getElementById('volume');
  const playIcon = '<i data-lucide="play"></i>';
  const pauseIcon = '<i data-lucide="pause"></i>';

  let projectLoaded = false;
  let isPlaying = false;

  const frameLoop = () => s.vm && s.vm.runtime && s.vm.runtime.frameLoop;
  const shaderRenderer = () => s._shaderRenderer;
  const audioContext = () => {
    const engine = s.vm && s.vm.runtime && s.vm.runtime.audioEngine;
    return engine && engine.audioContext;
  };

  const clock = () => s.vm && s.vm.runtime && s.vm.runtime.ioDevices && s.vm.runtime.ioDevices.clock;

  const setPlayIcon = (playing) => {
    playPauseBtn.innerHTML = playing ? pauseIcon : playIcon;
    playPauseBtn.setAttribute('aria-label', playing ? 'Pause' : 'Play');
    lucide.createIcons();
  };

  const startProject = () => {
    const ac = audioContext();
    if (ac && ac.state === 'suspended') ac.resume();
    const fl = frameLoop();
    if (fl && !fl.running) fl.start();
    const sr = shaderRenderer();
    if (sr && !sr._running) sr.start();
    s.greenFlag();
    isPlaying = true;
    projectLoaded = true;
    setPlayIcon(true);
    log('playing');
  };

  const resume = () => {
    const c = clock();
    if (c && c._paused) c.resume();
    const fl = frameLoop();
    if (fl && !fl.running) fl.start();
    const sr = shaderRenderer();
    if (sr && !sr._running) sr.start();
    const ac = audioContext();
    if (ac && ac.state === 'suspended') ac.resume();
    isPlaying = true;
    setPlayIcon(true);
    log('playing');
  };

  const pause = () => {
    const c = clock();
    if (c && !c._paused) c.pause();
    const fl = frameLoop();
    if (fl && fl.running) fl.stop();
    const sr = shaderRenderer();
    if (sr && sr._running) sr.stop();
    const ac = audioContext();
    if (ac && ac.state === 'running') ac.suspend();
    isPlaying = false;
    setPlayIcon(false);
    log('paused');
  };

  playPauseBtn.addEventListener('click', () => {
    if (!projectLoaded) {
      startProject();
    } else if (isPlaying) {
      pause();
    } else {
      resume();
    }
  });

  reloadBtn.addEventListener('click', () => {
    pause();
    startProject();
    log('reloaded');
  });

  volumeSlider.addEventListener('input', (e) => {
    const value = parseInt(e.target.value, 10) / 100;
    const audioEngine = s.vm && s.vm.runtime && s.vm.runtime.audioEngine;
    if (audioEngine && audioEngine.inputNode) {
      audioEngine.inputNode.gain.value = value;
    }
  });

  // Scratch URL loading
  const urlInput = document.getElementById('scratch-url');
  const loadUrlBtn = document.getElementById('load-url');

  const parseProjectId = (input) => {
    const trimmed = input.trim();
    if (!trimmed) return null;
    if (/^\d+$/.test(trimmed)) return trimmed;
    const match = trimmed.match(/projects\/(\d+)/);
    if (match) return match[1];
    const twMatch = trimmed.match(/turbowarp\.org\/#?(\d+)/);
    if (twMatch) return twMatch[1];
    return null;
  };

  const getProjectMetadata = async (projectId) => {
    const response = await fetch(`https://trampoline.turbowarp.org/api/projects/${projectId}`);
    if (response.status === 404) throw new Error('Project not found or unshared');
    if (!response.ok) throw new Error(`HTTP ${response.status}`);
    return response.json();
  };

  const getProjectData = async (projectId) => {
    const metadata = await getProjectMetadata(projectId);
    const response = await fetch(`https://projects.scratch.mit.edu/${projectId}?token=${metadata.project_token}`);
    if (!response.ok) throw new Error(`HTTP ${response.status}`);
    return response.arrayBuffer();
  };

  const loadProjectById = async (projectId, autoStart = true) => {
    loadUrlBtn.disabled = true;
    log('fetching project ' + projectId + '...');
    try {
      const data = await getProjectData(projectId);
      await s.loadProject(data);
      drop.classList.add('hidden');
      loaded = true;
      document.getElementById('container').classList.add('loaded');
      if (autoStart) {
        log('green flag');
        startProject();
        if (s._shaderRenderer) s._shaderRenderer.render();
        log('rendered: ' + s._shaderCanvas.width + 'x' + s._shaderCanvas.height);
      } else {
        log('loaded; press play to start');
      }
    } catch (err) {
      log('load failed: ' + err.message);
      console.error(err);
    } finally {
      loadUrlBtn.disabled = false;
    }
  };

  const loadFromUrl = async () => {
    const input = urlInput.value;
    const projectId = parseProjectId(input);
    if (!projectId) {
      log('invalid Scratch URL');
      return;
    }
    await loadProjectById(projectId, true);
  };

  const getProjectIdFromLocation = () => {
    const path = location.pathname;
    const numeric = path.match(/\/(\d+)\/?$/);
    if (numeric) return numeric[1];
    const projectMatch = path.match(/projects\/(\d+)/);
    if (projectMatch) return projectMatch[1];
    const params = new URLSearchParams(location.search);
    if (params.has('project')) return params.get('project');
    return null;
  };

  loadUrlBtn.addEventListener('click', loadFromUrl);
  urlInput.addEventListener('keydown', (e) => {
    if (e.key === 'Enter') loadFromUrl();
  });

  // Auto-load from URL hash/path on page load.
  // AudioContext cannot start without a user gesture, so we only load the
  // project and wait for the user to press Play before starting it.
  const autoLoadProjectId = getProjectIdFromLocation();
  if (autoLoadProjectId) {
    urlInput.value = 'https://scratch.mit.edu/projects/' + autoLoadProjectId + '/';
    loadProjectById(autoLoadProjectId, false);
  }

  // Drag & drop
  const drop = document.getElementById('drop');
  const fileInput = document.getElementById('file-input');
  let loaded = false;

  async function handleFile (file) {
    if (!file) { log('no file'); return; }
    log('loading: ' + file.name);
    let buf;
    try {
      buf = await file.arrayBuffer();
    } catch (err) {
      log('read failed: ' + err.message);
      console.error(err);
      return;
    }
    try {
      await s.loadProject(buf);
      drop.classList.add('hidden');
      loaded = true;
      document.getElementById('container').classList.add('loaded');
      if (document.activeElement && document.activeElement.blur) {
        document.activeElement.blur();
      }
      log('green flag');
      startProject();
      if (s._shaderRenderer) s._shaderRenderer.render();
      log('rendered: ' + s._shaderCanvas.width + 'x' + s._shaderCanvas.height);
    } catch (err) {
      log('load failed: ' + err.message);
      console.error(err);
    }
  }

  function onDragOver (e) {
    e.preventDefault();
    if (e.dataTransfer) e.dataTransfer.dropEffect = 'copy';
    drop.classList.add('over');
  }
  function onDragLeave (e) {
    if (e.relatedTarget == null) drop.classList.remove('over');
  }
  function onDrop (e) {
    e.preventDefault();
    drop.classList.remove('over');
    const file = e.dataTransfer && e.dataTransfer.files && e.dataTransfer.files[0];
    handleFile(file);
  }

  document.addEventListener('dragover', onDragOver);
  document.addEventListener('dragleave', onDragLeave);
  document.addEventListener('drop', onDrop);
  if (s._root) {
    s._root.addEventListener('dragover', onDragOver);
    s._root.addEventListener('drop', onDrop);
  }

  fileInput.addEventListener('change', (e) => {
    const file = e.target.files && e.target.files[0];
    handleFile(file);
    fileInput.value = '';
  });

  window.addEventListener('resize', () => s.relayout());

  window.addEventListener('keydown', (e) => {
    if (e.key === 'Escape' && loaded) location.reload();
  });
</script>
</body>
</html>
