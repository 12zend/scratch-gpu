<!DOCTYPE html>
<html>
  <head>
    <meta charset="utf-8">
    <meta http-equiv="Content-Security-Policy" content="default-src 'self' 'unsafe-inline' 'unsafe-eval' blob: data:; script-src 'self' 'unsafe-eval' 'unsafe-inline' blob: data:; img-src 'self' blob: data:;">
    <style>
      * { margin: 0; padding: 0; box-sizing: border-box; }
      html, body {
        width: 100%;
        height: 100%;
        overflow: hidden;
        background: #ffffff;
        user-select: none;
        -webkit-app-region: drag;
      }
      #drop {
        position: absolute;
        top: 0;
        left: 0;
        width: 100%;
        height: 100%;
        background: transparent;
        border: 4px dashed transparent;
        transition: background 0.15s ease, border-color 0.15s ease;
        -webkit-app-region: no-drag;
        z-index: 2000;
        pointer-events: none;
        display: flex;
        align-items: center;
        justify-content: center;
      }
      #drop.over {
        background: rgba(78, 201, 176, 0.15);
        border-color: #4ec9b0;
        pointer-events: auto;
      }
      #drop .drop-hint {
        padding: 14px 22px;
        background: rgba(255,255,255,0.92);
        border: 2px dashed #4ec9b0;
        border-radius: 16px;
        font-family: ui-monospace, "SF Mono", Menlo, Consolas, monospace;
        font-size: 13px;
        color: #1a6e5e;
        opacity: 0;
        transition: opacity 0.15s ease;
        pointer-events: none;
      }
      #drop.over .drop-hint { opacity: 1; }
      #load-btn {
        position: absolute;
        top: 8px;
        right: 8px;
        z-index: 1500;
        padding: 6px 12px;
        background: rgba(0, 0, 0, 0.55);
        color: #fff;
        border: 1px solid rgba(255,255,255,0.25);
        border-radius: 6px;
        font-family: ui-monospace, "SF Mono", Menlo, Consolas, monospace;
        font-size: 11px;
        cursor: pointer;
        -webkit-app-region: no-drag;
        user-select: none;
      }
      #load-btn:hover { background: rgba(0, 0, 0, 0.75); }
      #stage {
        position: absolute;
        top: 50%;
        left: 50%;
        transform: translate(-50%, -50%);
        -webkit-app-region: no-drag;
        display: none;
      }
      #stage.visible { display: block; }
      #stage-inner {
        width: 480px;
        height: 360px;
        max-width: calc(100vw - 40px);
        max-height: calc(100vh - 40px);
        border-radius: 0;
        overflow: hidden;
        background: #ffffff;
      }
      #loading {
        position: absolute;
        top: 50%;
        left: 50%;
        transform: translate(-50%, -50%);
        width: 48px;
        height: 48px;
        border: 4px solid rgba(255,255,255,0.1);
        border-top-color: #4ec9b0;
        border-radius: 50%;
        animation: spin 0.8s linear infinite;
        display: none;
        -webkit-app-region: no-drag;
      }
      #loading.visible { display: block; }
      @keyframes spin { to { transform: translate(-50%, -50%) rotate(360deg); } }
    </style>
  </head>
  <body>
    <div id="drop"><div class="drop-hint">sb3 ファイルをドロップして再ロード</div></div>
    <button id="load-btn">sb3 を開く</button>
    <div id="loading"></div>
    <div id="stage"><div id="stage-inner"></div></div>
    <script src="../dist/scaffolding-min.js"></script>
    <script src="renderer.js"></script>
  </body>
</html>
