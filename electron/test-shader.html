<!DOCTYPE html>
<html>
<head>
  <title>GLSL Test</title>
  <script>
    window.addEventListener('load', async () => {
      const log = [];
      const errs = [];
      try {
        const response = await fetch('../test/output.glsl');
        const src = await response.text();
        const canvas = document.getElementById('c');
        const gl = canvas.getContext('webgl');
        const fs = gl.createShader(gl.FRAGMENT_SHADER);
        gl.shaderSource(fs, src);
        gl.compileShader(fs);
        if (!gl.getShaderParameter(fs, gl.COMPILE_STATUS)) {
          errs.push('SHADER COMPILE: ' + gl.getShaderInfoLog(fs));
        } else {
          log.push('SHADER COMPILED OK');
        }
        // Try vertex too
        const vs = gl.createShader(gl.VERTEX_SHADER);
        gl.shaderSource(vs, 'attribute vec2 a_pos; void main() { gl_Position = vec4(a_pos, 0.0, 1.0); }');
        gl.compileShader(vs);
        if (!gl.getShaderParameter(vs, gl.COMPILE_STATUS)) {
          errs.push('VERTEX COMPILE: ' + gl.getShaderInfoLog(vs));
        }
        // Link
        const prog = gl.createProgram();
        gl.attachShader(prog, vs);
        gl.attachShader(prog, fs);
        gl.linkProgram(prog);
        if (!gl.getProgramParameter(prog, gl.LINK_STATUS)) {
          errs.push('LINK: ' + gl.getProgramInfoLog(prog));
        } else {
          log.push('PROGRAM LINKED OK');
        }
        // Try drawing
        gl.useProgram(prog);
        const buf = gl.createBuffer();
        gl.bindBuffer(gl.ARRAY_BUFFER, buf);
        gl.bufferData(gl.ARRAY_BUFFER, new Float32Array([-1,-1,1,-1,-1,1,1,1]), gl.STATIC_DRAW);
        const posLoc = gl.getAttribLocation(prog, 'a_pos');
        gl.enableVertexAttribArray(posLoc);
        gl.vertexAttribPointer(posLoc, 2, gl.FLOAT, false, 0, 0);
        gl.viewport(0, 0, 480, 360);
        gl.drawArrays(gl.TRIANGLE_STRIP, 0, 4);
        const drawErr = gl.getError();
        if (drawErr) errs.push('DRAW: 0x' + drawErr.toString(16));
        else log.push('DRAW OK');
      } catch (e) {
        errs.push('EXCEPTION: ' + e.message);
      }
      document.body.setAttribute('data-log', log.join('|'));
      document.body.setAttribute('data-errs', errs.join('|'));
      console.log('LOG:', log);
      console.log('ERRS:', errs);
    });
  </script>
</head>
<body>
  <canvas id="c" width="480" height="360"></canvas>
</body>
</html>
